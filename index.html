<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>『大学入試漢字 TOP 2000』漢字テスト 自動作成</title>
<style>

  /* システムフォント（オフライン対応）*/

  :root {
    --ink:     #0f1e2d;       /* 深藍 */
    --paper:   #f4f8fb;       /* 青白い紙 */
    --accent:  #2a6e8c;       /* 青磁色 */
    --accent2: #3a8fad;       /* 明るい青磁 */
    --red:     #c0392b;       /* 朱色アクセント */
    --border:  #b8d4e0;       /* 青みがかったボーダー */
    --muted:   #5a7a8a;       /* 青みグレー */
    --surface: #e8f3f8;       /* 薄い青磁面 */
    --white:   #ffffff;
    /* 旧変数の互換エイリアス */
    --gold:    #2a6e8c;
    --gold2:   #3a8fad;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo UI', Meiryo, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 10% 20%, rgba(42,110,140,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(15,30,45,0.04) 0%, transparent 50%);
  }

  header {
    background: linear-gradient(135deg, #0f1e2d 0%, #1a3a52 60%, #0d2d42 100%);
    padding: 2rem 2rem 1.6rem;
    text-align: center;
    border-bottom: 3px solid var(--accent2);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      90deg, transparent, transparent 40px,
      rgba(58,143,173,0.08) 40px, rgba(58,143,173,0.08) 41px
    );
  }
  header h1 {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: #e8f4f8;
    font-weight: 700;
    letter-spacing: 0.05em;
    position: relative;
  }
  header h1 span {
    color: var(--accent2);
    display: block;
    font-size: clamp(0.75rem, 2vw, 0.95rem);
    font-weight: 400;
    margin-top: 0.3rem;
    letter-spacing: 0.15em;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.2rem 3rem;
  }

  /* セクション */
  .section {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 1.4rem;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(26,18,8,0.06);
  }
  .section-head {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 0.75rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .section-head h2 {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.05em;
  }
  .badge {
    background: var(--accent2);
    color: var(--white);
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.15rem 0.5rem;
    border-radius: 1px;
    letter-spacing: 0.05em;
  }
  .badge.red { background: var(--red); }
  .section-body { padding: 1.2rem; }

  /* タイトル入力 */
  .field-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 0.6rem;
  }
  .field-label {
    font-size: 0.82rem;
    color: var(--muted);
    white-space: nowrap;
    min-width: 5rem;
  }
  input[type="text"] {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.5rem 0.75rem;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo UI', Meiryo, sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--paper);
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  /* 章選択グリッド */
  .chapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.8rem;
  }
  .chapter-card {
    border: 1.5px solid var(--border);
    border-radius: 2px;
    padding: 0.9rem 1rem;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
    position: relative;
  }
  .chapter-card:hover { background: var(--surface); }
  .chapter-card.selected {
    border-color: var(--accent);
    background: #e8f4f8;
  }
  .chapter-card label {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    cursor: pointer;
  }
  .chapter-card input[type="checkbox"] {
    width: 15px; height: 15px;
    flex-shrink: 0;
    margin-top: 2px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .chapter-name {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.4;
  }
  .chapter-count {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  /* 番号範囲 */
  .range-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.7rem;
    flex-wrap: wrap;
  }
  .range-row label {
    font-size: 0.78rem;
    color: var(--muted);
  }
  input[type="number"] {
    width: 70px;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.28rem 0.4rem;
    font-size: 0.82rem;
    color: var(--ink);
    background: var(--paper);
    outline: none;
    text-align: center;
  }
  input[type="number"]:focus { border-color: var(--accent); }

  /* プール情報 */
  .pool-info {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.8rem 1rem;
    margin-top: 1rem;
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
  }
  .pool-stat {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .pool-stat .stat-label {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .pool-stat .stat-val {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif;
  }
  .stat-val.warn { color: var(--red); }
  .stat-val.ok   { color: var(--accent); }

  /* 生成ボタン */
  .gen-btn {
    display: block;
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, #0f1e2d 0%, #1a3a52 100%);
    color: #e8f4f8;
    border: none;
    border-radius: 2px;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
    position: relative;
    overflow: hidden;
  }
  .gen-btn::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent2);
  }
  .gen-btn:hover:not(:disabled) { background: linear-gradient(135deg, #1a3a52 0%, #2a6e8c 100%); transform: translateY(-1px); }
  .gen-btn:active:not(:disabled) { transform: translateY(0); }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(250,246,239,0.3);
    border-top-color: var(--paper);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* アラート */
  .alert {
    padding: 0.9rem 1rem;
    border-radius: 2px;
    margin-top: 1rem;
    font-size: 0.88rem;
    display: none;
  }
  .alert-ok  { background: #f0faf0; border: 1px solid #6aad6a; color: #2d6a2d; }
  .alert-err { background: #fdf0f0; border: 1px solid #c77; color: #7a1a1a; }

  /* プレビュー */
  .preview {
    display: none;
    margin-top: 1.4rem;
  }
  .preview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  @media(max-width: 560px) { .preview-grid { grid-template-columns: 1fr; } }
  .preview-col h3 {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.6rem;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.4rem;
  }
  .preview-list {
    list-style: none;
    font-size: 0.8rem;
    line-height: 1.9;
    color: var(--ink);
  }
  .preview-list li { display: flex; gap: 0.4rem; }
  .preview-list .num { color: var(--muted); min-width: 1.8rem; text-align: right; font-size: 0.72rem; }
  .preview-list .qa  { color: var(--accent); font-weight: 500; }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 1.5rem 0;
  }


  /* セクション選択UI */
  .chapter-section { margin-bottom: 1.6rem; }
  .chapter-section-head {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink);
    padding: 0.5rem 0.8rem;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    border-radius: 1px;
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .chapter-section-head .sec-count {
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 400;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
  }
  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 0.5rem;
  }
  .section-card {
    border: 1.5px solid var(--border);
    border-radius: 2px;
    padding: 0.6rem 0.8rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .section-card:hover { background: var(--surface); }
  .section-card.selected { border-color: var(--accent); background: #e8f4f8; }
  .section-card label {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    cursor: pointer;
  }
  .section-card input[type="checkbox"] {
    width: 14px; height: 14px;
    flex-shrink: 0;
    margin-top: 2px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .section-label {
    font-size: 0.8rem;
    color: var(--ink);
    line-height: 1.35;
  }
  .section-q-count {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }
  .select-all-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
    flex-wrap: wrap;
  }
  .sel-btn {
    font-size: 0.75rem;
    padding: 0.25rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--white);
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .sel-btn:hover { background: var(--surface); color: var(--ink); }

</style>
</head>
<body>

<header>
  <h1>
    『大学入試漢字 TOP 2000』漢字テスト 自動作成
    <span>書き取り 20問 ＋ 読み 10問 = 30問</span>
  </h1>
</header>

<div class="container">

  <!-- タイトル -->
  <div class="section">
    <div class="section-head"><h2>テストタイトル</h2></div>
    <div class="section-body">
      <div class="field-row">
        <span class="field-label">タイトル</span>
        <input type="text" id="title" value="漢字テスト" placeholder="漢字テスト">
      </div>
      <div class="field-row" style="margin-top:0.5rem;">
        <span class="field-label">実施日</span>
        <input type="number" id="test-month" min="1" max="12" value="4"
               style="width:52px; text-align:center;">
        <span style="font-size:0.9rem; color:var(--ink);">月</span>
        <input type="number" id="test-day" min="1" max="31" value="1"
               style="width:52px; text-align:center; margin-left:0.3rem;">
        <span style="font-size:0.9rem; color:var(--ink);">日</span>
      </div>
    </div>
  </div>

  <!-- 書き取り範囲 -->
  <div class="section">
    <div class="section-head">
      <h2>書き取り問題の範囲</h2>
      <span class="badge">20問出題</span>
    </div>
    <div class="section-body" id="writing-body"></div>
  </div>

  <!-- 読み範囲 -->
  <div class="section">
    <div class="section-head">
      <h2>読み問題の範囲</h2>
      <span class="badge red">10問出題</span>
    </div>
    <div class="section-body" id="reading-body"></div>
  </div>

  <!-- プール情報 -->
  <div class="pool-info">
    <div class="pool-stat">
      <span class="stat-label">書き取りプール</span>
      <span class="stat-val" id="w-pool-count">0</span>
    </div>
    <div class="pool-stat">
      <span class="stat-label">読みプール</span>
      <span class="stat-val" id="r-pool-count">0</span>
    </div>
    <div class="pool-stat">
      <span class="stat-label">出題数</span>
      <span class="stat-val">書き取り20 ／ 読み10</span>
    </div>
  </div>

  <!-- 生成ボタン -->
  <button class="gen-btn" id="gen-btn" onclick="generate()">
    📥　テストを生成してダウンロード
  </button>
  <div class="alert" id="alert-box"></div>

  <!-- プレビュー -->
  <div class="preview" id="preview-box">
    <div class="divider"></div>
    <div class="section">
      <div class="section-head"><h2>出題内容プレビュー</h2></div>
      <div class="section-body">
        <div class="preview-grid">
          <div class="preview-col">
            <h3>書き取り（20問）</h3>
            <ul class="preview-list" id="preview-writing"></ul>
          </div>
          <div class="preview-col">
            <h3>読み（10問）</h3>
            <ul class="preview-list" id="preview-reading"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

// ===== UIビルド =====
function buildSectionUI(groups, containerId, type) {
  var cont = document.getElementById(containerId);
  cont.innerHTML = '';
  groups.forEach(function(grp) {
    var sections = (ALL_SECTIONS[type] || {})[grp.key] || [];
    if (!sections.length) return;
    var totalQ = sections.reduce(function(s,x){return s+x.items.length;}, 0);

    var div = document.createElement('div');
    div.className = 'chapter-section';
    // 章ヘッダー
    var head = document.createElement('div');
    head.className = 'chapter-section-head';
    head.innerHTML = grp.label + '<span class="sec-count">全' + totalQ + '問</span>';
    div.appendChild(head);

    // 全選択・全解除ボタン
    var selRow = document.createElement('div');
    selRow.className = 'select-all-row';
    var btnAll = document.createElement('button');
    btnAll.className = 'sel-btn';
    btnAll.textContent = 'すべて選択';
    var grpKey = grp.key;
    btnAll.onclick = function(){ toggleGroup(type, grpKey, true); };
    var btnNone = document.createElement('button');
    btnNone.className = 'sel-btn';
    btnNone.textContent = 'すべて解除';
    btnNone.onclick = function(){ toggleGroup(type, grpKey, false); };
    selRow.appendChild(btnAll);
    selRow.appendChild(btnNone);
    div.appendChild(selRow);

    // セクションカードグリッド
    var grid = document.createElement('div');
    grid.className = 'section-grid';

    sections.forEach(function(sec, idx) {
      var card = document.createElement('div');
      card.className = 'section-card';
      card.id = 'card-' + type + '-' + grp.key + '-' + idx;

      // ラベル整形：番号プレフィックスを削除してすっきりさせる
      var labelClean = sec.label
        .replace(/^[\d]+\.\s*/, '')   // "1. " を削除
        .replace(/^[IVX]+\.\s*/, '')  // ローマ数字を削除
        .trim();

      var chkId = 'chk-' + type + '-' + grp.key + '-' + idx;
      card.innerHTML =
        '<label>' +
          '<input type="checkbox" id="' + chkId + '" ' +
                 'data-type="' + type + '" data-key="' + grp.key + '" data-idx="' + idx + '" ' +
                 'onchange="onChkChange()">' +
          '<div>' +
            '<div class="section-label">' + labelClean + '</div>' +
            '<div class="section-q-count">' + sec.items.length + '問</div>' +
          '</div>' +
        '</label>';
      grid.appendChild(card);
    });
    div.appendChild(grid);
    cont.appendChild(div);
  });
}

buildSectionUI(WRITING_GROUPS, 'writing-body', 'writing');
buildSectionUI(READING_GROUPS, 'reading-body', 'reading');

// ===== グループ全選択/解除 =====
function toggleGroup(type, key, checked) {
  var sections = (ALL_SECTIONS[type] || {})[key] || [];
  sections.forEach(function(_, idx) {
    var chk = document.getElementById('chk-' + type + '-' + key + '-' + idx);
    if (chk) chk.checked = checked;
    var card = document.getElementById('card-' + type + '-' + key + '-' + idx);
    if (card) card.className = 'section-card' + (checked ? ' selected' : '');
  });
  onChkChange();
}

// ===== プール取得（チェックされたセクションの問題のみ） =====
function getPoolBySections(type) {
  var result = [];  // [[items of sec1], [items of sec2], ...]
  var groups = type === 'writing' ? WRITING_GROUPS : READING_GROUPS;
  groups.forEach(function(grp) {
    var sections = (ALL_SECTIONS[type] || {})[grp.key] || [];
    sections.forEach(function(sec, idx) {
      var chk = document.getElementById('chk-' + type + '-' + grp.key + '-' + idx);
      if (chk && chk.checked) {
        result.push(sec.items.slice());  // そのセクションの全問題
      }
    });
  });
  return result;
}

function getPool(type) {
  var pool = [];
  getPoolBySections(type).forEach(function(s){ s.forEach(function(x){pool.push(x);});  });
  return pool;
}

// ===== チェック変更時 =====
function onChkChange() {
  // カード見た目更新
  ['writing','reading'].forEach(function(type) {
    var groups = type === 'writing' ? WRITING_GROUPS : READING_GROUPS;
    groups.forEach(function(grp) {
      var sections = (ALL_SECTIONS[type] || {})[grp.key] || [];
      sections.forEach(function(_, idx) {
        var chk  = document.getElementById('chk-'  + type + '-' + grp.key + '-' + idx);
        var card = document.getElementById('card-' + type + '-' + grp.key + '-' + idx);
        if (chk && card) card.className = 'section-card' + (chk.checked ? ' selected' : '');
      });
    });
  });

  var wPool = getPool('writing');
  var rPool = getPool('reading');
  var wEl = document.getElementById('w-pool-count');
  var rEl = document.getElementById('r-pool-count');
  wEl.textContent = wPool.length + '問';
  rEl.textContent = rPool.length + '問';
  wEl.className = 'stat-val' + (wPool.length === 0 ? ' warn' : wPool.length < 20 ? ' warn' : ' ok');
  rEl.className = 'stat-val' + (rPool.length === 0 ? ' warn' : rPool.length < 10 ? ' warn' : ' ok');
}

// ===== シャッフル・均等選択 =====
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length-1; i > 0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function pickBalanced(bySec, n) {
  if (!bySec.length) return [];
  var base  = Math.floor(n / bySec.length);
  var extra = n % bySec.length;
  var selected = [], leftovers = [], shortfall = 0;
  for (var i = 0; i < bySec.length; i++) {
    var need = base + (i < extra ? 1 : 0) + shortfall;
    var sh = shuffle(bySec[i]);
    if (sh.length >= need) {
      for (var j = 0; j < need; j++) selected.push(sh[j]);
      for (var j = need; j < sh.length; j++) leftovers.push(sh[j]);
      shortfall = 0;
    } else {
      for (var j = 0; j < sh.length; j++) selected.push(sh[j]);
      shortfall = need - sh.length;
    }
  }
  if (shortfall > 0 && leftovers.length > 0) {
    shuffle(leftovers).slice(0, shortfall).forEach(function(x){selected.push(x);});
  }
  return selected;
}

// ===== XLSX生成（前回と同じロジック）=====
async function buildXLSX(title, wSel, rSel, includeAns) {
  var bin = atob(TMPL);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

  var zip = await JSZip.loadAsync(bytes);
  var sst   = await zip.file('xl/sharedStrings.xml').async('string');
  var sheet = await zip.file('xl/worksheets/sheet1.xml').async('string');

  var strings = [];
  sst.replace(/<si>[\s\S]*?<\/si>/g, function(si) {
    var m = si.match(/<t[^>]*>([^<]*)<\/t>/);
    strings.push(m ? m[1] : '');
  });

  function xmlEsc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function getOrAdd(text) {
    var e = xmlEsc(text);
    var i = strings.indexOf(text); if (i >= 0) return i;
    i = strings.indexOf(e);        if (i >= 0) return i;
    strings.push(text);
    return strings.length - 1;
  }

  // wrapText化 (s=18→s=17)
  sheet = sheet.replace(/ s="18"\//g, ' s="17"/');

  // タイトル (X2)：タイトル＋日付を共有文字列として書き込む
  // 改行は&#10;エンティティで表現（wrapText=trueのセルで改行表示される）
  // strings配列に直接追加してxmlEscを通さない形で管理
  var titleParts = title.split('\n');
  var titleXml;
  if (titleParts.length === 1) {
    titleXml = '<si><t>' + xmlEsc(title) + '</t></si>';
  } else {
    // 改行あり：xml:space="preserve" + &#10; で改行
    titleXml = '<si><t xml:space="preserve">' +
      titleParts.map(function(p){ return xmlEsc(p); }).join('&#10;') +
      '</t></si>';
  }
  var titleIdx = strings.length;
  strings.push(title);  // プレースホルダー追加
  // SSTは後で再構築するのでここで直接XMLを差し込む
  var _origLen = strings.length;
  // → SST再構築時に正しく出るよう、strings配列の最後の要素を特殊マーク
  strings[strings.length - 1] = '\x00TITLE_XML\x00' + titleXml;
  sheet = sheet.replace(/<c r="X2"([^>]*)><v>[^<]*<\/v><\/c>/, function(_, attrs) {
    return '<c r="X2"' + attrs + '><v>' + titleIdx + '</v></c>';
  });

  // 問題文セット
  wSel.forEach(function(p, i) {
    var coord = WC[i+1];
    var idx = getOrAdd(p.q);
    sheet = sheet.replace(new RegExp('<c r="' + coord + '" s="17"/>'),
      '<c r="' + coord + '" s="17" t="s"><v>' + idx + '</v></c>');
  });
  rSel.forEach(function(p, i) {
    var coord = RC[i+21];
    var idx = getOrAdd(p.k);
    sheet = sheet.replace(new RegExp('<c r="' + coord + '" s="17"/>'),
      '<c r="' + coord + '" s="17" t="s"><v>' + idx + '</v></c>');
  });

  // 解答セル
  if (includeAns) {
    wSel.forEach(function(p, i) {
      var coord = AC[i+1];
      var idx = getOrAdd(p.a);
      sheet = sheet.replace(new RegExp('<c r="' + coord + '" s="22"/>'),
        '<c r="' + coord + '" s="22" t="s"><v>' + idx + '</v></c>');
    });
    rSel.forEach(function(p, i) {
      var coord = AC[i+21];
      var idx = getOrAdd(p.a);
      sheet = sheet.replace(new RegExp('<c r="' + coord + '" s="22"/>'),
        '<c r="' + coord + '" s="22" t="s"><v>' + idx + '</v></c>');
    });
  }

  // sharedStrings再構築
  var n = strings.length;
  var body = strings.map(function(s) {
    if (s && s.indexOf('\x00TITLE_XML\x00') === 0) {
      return s.slice('\x00TITLE_XML\x00'.length);  // 既にXMLなのでそのまま使う
    }
    return '<si><t>' + xmlEsc(s) + '</t></si>';
  }).join('');
  sst = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n'
      + '<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      + 'count="' + n + '" uniqueCount="' + n + '">' + body + '</sst>';

  zip.file('xl/sharedStrings.xml', sst);
  zip.file('xl/worksheets/sheet1.xml', sheet);
  return await zip.generateAsync({type:'blob', compression:'DEFLATE'});
}

// ===== ダウンロード =====
function dlBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

// ===== 生成メイン =====
async function generate() {
  var wBySec = getPoolBySections('writing');
  var rBySec = getPoolBySections('reading');
  var wPool  = getPool('writing');
  var rPool  = getPool('reading');

  var alertBox = document.getElementById('alert-box');
  if (!wPool.length) {
    alertBox.className = 'alert alert-err';
    alertBox.textContent = '❌ 書き取り問題の範囲を選択してください。';
    alertBox.style.display = 'block'; return;
  }
  if (!rPool.length) {
    alertBox.className = 'alert alert-err';
    alertBox.textContent = '❌ 読み問題の範囲を選択してください。';
    alertBox.style.display = 'block'; return;
  }

  var btn = document.getElementById('gen-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>生成中...';
  alertBox.style.display = 'none';

  try {
    var title    = document.getElementById('title').value || '漢字テスト';
    var month = document.getElementById('test-month').value;
    var day   = document.getElementById('test-day').value;
    var testDate = month + '月' + day + '日';
    // X2セルに入れるタイトル文字列：改行して下に日付を追加
    var xlsxTitle    = title + '\n' + testDate;
    var xlsxTitleKai = title + '【解答】\n' + testDate;
    var wSel  = pickBalanced(wBySec, 20);
    var rSel  = pickBalanced(rBySec, 10);
    var safe  = title.replace(/[\/\\:*?"<>|]/g, '_');

    var mondai = await buildXLSX(xlsxTitle, wSel, rSel, false);
    dlBlob(mondai, safe + '_問題.xlsx');
    await new Promise(function(r){ setTimeout(r, 400); });
    var kaitou = await buildXLSX(xlsxTitleKai, wSel, rSel, true);
    dlBlob(kaitou, safe + '_解答.xlsx');

    alertBox.className = 'alert alert-ok';
    alertBox.innerHTML = '✅ <strong>' + safe + '_問題.xlsx</strong> と <strong>' + safe + '_解答.xlsx</strong> をダウンロードしました！<br>'
      + '<span style="font-size:.8rem;opacity:.8">再度押すと別のランダム問題が生成されます。</span>';
    alertBox.style.display = 'block';
    showPreview(wSel, rSel);
  } catch(e) {
    alertBox.className = 'alert alert-err';
    alertBox.textContent = '❌ エラー: ' + e.message;
    alertBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '📥　テストを生成してダウンロード';
  }
}

// ===== プレビュー =====
function showPreview(wSel, rSel) {
  var wList = document.getElementById('preview-writing');
  var rList = document.getElementById('preview-reading');
  wList.innerHTML = '';
  rList.innerHTML = '';
  wSel.forEach(function(p, i) {
    var li = document.createElement('li');
    li.innerHTML = '<span class="num">(' + (i+1) + ')</span>'
      + '<span>' + p.q + '</span>'
      + '<span class="qa">→ ' + p.a + '</span>';
    wList.appendChild(li);
  });
  rSel.forEach(function(p, i) {
    var li = document.createElement('li');
    li.innerHTML = '<span class="num">(' + (i+21) + ')</span>'
      + '<span>' + p.k + '</span>'
      + '<span class="qa">→ ' + p.a + '</span>';
    rList.appendChild(li);
  });
  document.getElementById('preview-box').style.display = 'block';
}
</script>
</body>
</html>
